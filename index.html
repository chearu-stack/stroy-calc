<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stroy-Calc — строительные калькуляторы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Stroy-Calc</h1>
        <p class="subtitle">Инженерные расчёты для строительства и ремонта</p>

        <div class="block">
            <label for="section">Раздел</label>
            <select id="section">
                <option value="">— Выберите раздел —</option>
            </select>
        </div>

        <div class="block hidden" id="subsection-block">
            <label for="subsection">Подраздел</label>
            <select id="subsection">
                <option value="">— Выберите подраздел —</option>
            </select>
        </div>

        <div class="block hidden" id="calculator-block">
            <label for="calculator">Калькулятор</label>
            <select id="calculator">
                <option value="">— Выберите калькулятор —</option>
            </select>
        </div>

        <div id="fields" class="hidden"></div>

        <button id="calculate" class="hidden">Рассчитать</button>

        <div id="result" class="hidden"></div>

        <div id="export-block" class="hidden">
            <div class="export-title">Экспорт результата</div>
            <div class="export-buttons">
                <button id="copy-result" class="export-btn">Скопировать</button>
                <button id="download-txt" class="export-btn">Скачать TXT</button>
                <button id="print-result" class="export-btn">Печать</button>
            </div>
        </div>
    </div>

    <!-- Данные -->
    <script src="data/regions.js"></script>
    <script src="data/soils.js"></script>
    <script src="data/wall-materials.js"></script>
    <script src="data/taxonomy.js"></script>
    <script src="data/electrical.js"></script>
    <script src="data/plumbing.js"></script>
    <script src="data/heating.js"></script>
    <!-- Реестр -->
    <script src="registry.js"></script>

    <!-- Геология -->
    <script src="sections/geology/foundation-depth.js"></script>
    <script src="sections/geology/foundation-type.js"></script>
    <script src="sections/geology/foundation-load.js"></script>
    <script src="sections/geology/drainage.js"></script>

    <!-- Фундамент -->
    <script src="sections/foundation/strip.js"></script>
    <script src="sections/foundation/slab.js"></script>
    <script src="sections/foundation/piles.js"></script>
    <script src="sections/foundation/concrete-volume.js"></script>
    <script src="sections/foundation/rebar-spacing.js"></script>

    <!-- Коробка (стены) -->
    <script src="sections/walls/single-layer.js"></script>
    <script src="sections/walls/insulation-thickness.js"></script>
    <script src="sections/walls/r-value.js"></script>
    <script src="sections/walls/bearing.js"></script>
    <script src="sections/walls/economy.js"></script>
    <script src="sections/walls/brick-count.js"></script>
    <script src="sections/walls/insulation-packs.js"></script>

    <!-- Кровля -->
    <script src="sections/roofing/insulation.js"></script>
    <script src="sections/roofing/rafters.js"></script>
    <script src="sections/roofing/ventilation.js"></script>
    <script src="sections/roofing/gutter.js"></script>

    <!-- Инженерные системы: Электрика -->
    <script src="sections/engineering/electrical/cable-section.js"></script>
    <script src="sections/engineering/electrical/breaker.js"></script>
    <script src="sections/engineering/electrical/grounding.js"></script>

    <!-- Инженерные системы: Сантехника -->
    <script src="sections/engineering/plumbing/pump.js"></script>
    <script src="sections/engineering/plumbing/hydroaccumulator.js"></script>
    <script src="sections/engineering/plumbing/sewer-slope.js"></script>
    <script src="sections/engineering/plumbing/septic.js"></script>

    <!-- Инженерные системы: Отопление -->
    <script src="sections/engineering/heating/heat-loss.js"></script>
    <script src="sections/engineering/heating/radiators.js"></script>
    <script src="sections/engineering/heating/expansion-tank.js"></script>
    <script src="sections/engineering/heating/pump.js"></script>

    <!-- Инженерные системы: Вентиляция -->
    <script src="sections/engineering/ventilation/air-exchange.js"></script>
    <script src="sections/engineering/ventilation/recuperator.js"></script>
    <script src="sections/engineering/ventilation/ducts.js"></script>

    <!-- Инженерные системы: Дренаж и ливнёвка -->
    <script src="sections/engineering/drainage/perimeter.js"></script>
    <script src="sections/engineering/drainage/stormwater.js"></script>

    <!-- Инженерные системы: Слаботочка -->
    <script src="sections/engineering/lowvoltage/network.js"></script>
    <script src="sections/engineering/lowvoltage/cameras.js"></script>

    <!-- Окна и двери -->
    <script src="sections/openings/windows-area.js"></script>
    <script src="sections/openings/heat-loss.js"></script>
    <script src="sections/openings/lintels.js"></script>

    <!-- Фасад -->
    <script src="sections/facade/insulation.js"></script>
    <script src="sections/facade/siding.js"></script>
    <script src="sections/facade/plaster.js"></script>

    <!-- Отмостка и дренаж -->
    <script src="sections/drainage/blind-area.js"></script>
    <script src="sections/drainage/perimeter.js"></script>
    <script src="sections/drainage/stormwater.js"></script>

    <!-- Внутренняя отделка -->
    <script src="sections/interior/paint.js"></script>
    <script src="sections/interior/screed.js"></script>
    <script src="sections/interior/plaster.js"></script>
    <script src="sections/interior/tile.js"></script>

    <!-- Благоустройство -->
    <script src="sections/landscaping/concrete.js"></script>
    <script src="sections/landscaping/paving.js"></script>
    <script src="sections/landscaping/slope.js"></script>

    <!-- Движок -->
    <script src="engine.js"></script>
</body>
</html>
